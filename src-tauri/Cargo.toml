[package]
name = "ripper"
version = "0.1.0"
description = "Grab perspective quads from any image and flatten them into frontal textures"
edition = "2021"
rust-version = "1.80"

# Tauri-free core (geometry, warp, export, settings). A distinct name avoids the
# lib/bin .pdb filename collision on Windows.
[lib]
name = "ripper_core"
path = "src/lib.rs"

[[bin]]
name = "ripper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rayon = "1"
arboard = "3"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Image decoding and warping are unusably slow without optimisation, even in dev.
[profile.dev.package."*"]
opt-level = 3
